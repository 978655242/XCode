<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- XCODE: 桌面页面标题与应用展示名保持一致。 -->
    <title>Aiscoo</title>
    <script>
      // XCODE: 启动壳早于 React；按现有主题偏好绘制首帧，避免系统外观与应用主题不同时闪色。
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("zcode-theme");
        } catch {
          saved = null;
        }
        const dark = saved === "system"
          ? window.matchMedia("(prefers-color-scheme: dark)").matches
          : !saved || saved === "dark" || saved === "zai-dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("theme-zai-dark", dark);
        document.documentElement.classList.toggle("theme-zai-light", !dark);
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        /* XCODE: 透明窗口会透出系统材质，启动壳使用与 React 阻塞页一致的主题背景。 */
        background: var(--color-background, #f8f8f8);
        transition: opacity 0.16s ease;
      }

      html.dark #loading {
        background: var(--color-background, #161616);
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        /* XCODE: ai 原稿保持透明，不叠加固定黑色底板。 */
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo { width: 96px; height: 96px; object-fit: contain; }
      /* XCODE: 根据应用主题类选择图稿，与 React 启动页保持一致。 */
      .aiscoo-startup-dark, .aiscoo-startup-still { display: none; }
      html.dark .aiscoo-startup-motion.aiscoo-startup-light { display: none; }
      html.dark .aiscoo-startup-motion.aiscoo-startup-dark { display: block; }
      @media (prefers-reduced-motion: reduce) {
        .aiscoo-startup-motion { display: none !important; }
        .aiscoo-startup-still.aiscoo-startup-light { display: block; }
        html.dark .aiscoo-startup-still.aiscoo-startup-light { display: none; }
        html.dark .aiscoo-startup-still.aiscoo-startup-dark { display: block; }
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" class="[app-region:drag]" role="status" aria-busy="true" aria-label="Loading...">
      <div class="startup-logo-shell">
        <!-- XCODE: 桌面启动壳使用随包 ai 动画原稿与减弱动效静态稿。 -->
        <!-- XCODE: src 由下方模块脚本注入。Vite dev 不重写 <img src>，仓库根相对路径会被 SPA fallback 成 index.html 导致破图；
             ?url 导入在 dev 解析为 /@fs 直连文件、在 build 产物化，两端都指向同一品牌资源。 -->
        <img data-startup-asset="startup-light" class="startup-logo aiscoo-startup-motion aiscoo-startup-light" alt="" aria-hidden="true" />
        <img data-startup-asset="startup-dark" class="startup-logo aiscoo-startup-motion aiscoo-startup-dark" alt="" aria-hidden="true" />
        <img data-startup-asset="mark-light" class="startup-logo aiscoo-startup-still aiscoo-startup-light" alt="" aria-hidden="true" />
        <img data-startup-asset="mark-dark" class="startup-logo aiscoo-startup-still aiscoo-startup-dark" alt="" aria-hidden="true" />
      </div>
    </div>
    <script type="module">
      import startupLightUrl from "../../../ui/src/aiscoo/brand/assets/startup-light.svg?url";
      import startupDarkUrl from "../../../ui/src/aiscoo/brand/assets/startup-dark.svg?url";
      import markLightUrl from "../../../ui/src/aiscoo/brand/assets/mark-light.svg?url";
      import markDarkUrl from "../../../ui/src/aiscoo/brand/assets/mark-dark.svg?url";
      // 修复依据：模块导入进入 Vite 依赖图，dev 与 build 得到可加载的同源资源 URL，
      // 不再依赖静态 src 属性的路径解析，避免 dev 破图与 build 资源两套来源。
      const startupAssetUrls = {
        "startup-light": startupLightUrl,
        "startup-dark": startupDarkUrl,
        "mark-light": markLightUrl,
        "mark-dark": markDarkUrl,
      };
      for (const img of document.querySelectorAll("img[data-startup-asset]")) {
        const url = startupAssetUrls[img.dataset.startupAsset];
        if (url) img.src = url;
      }
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 修复原因：主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // Bugfix: 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
