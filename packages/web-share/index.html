    <title>Aiscoo Conversation Share</title>
    <style>
      /* XCODE: 独立分享页在入口脚本加载前也展示同源 ai，透明原稿随背景主题切换。 */
      .aiscoo-share-startup {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
      }
      .aiscoo-share-startup img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      .aiscoo-share-light,
      .aiscoo-share-still {
        display: none;
      }
      html:not(.dark) .aiscoo-share-motion.aiscoo-share-light {
        display: block;
      }
      html:not(.dark) .aiscoo-share-motion.aiscoo-share-dark {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .aiscoo-share-motion {
          display: none !important;
        }
        html.dark .aiscoo-share-still.aiscoo-share-dark {
          display: block;
        }
        html:not(.dark) .aiscoo-share-still.aiscoo-share-light {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="aiscoo-share-startup" role="status" aria-busy="true" aria-label="Loading...">
        <img
          src="../ui/src/xwork/brand/assets/startup-light.svg"
          class="aiscoo-share-motion aiscoo-share-light"
          alt=""
          aria-hidden="true"
        />
        <img
          src="../ui/src/xwork/brand/assets/startup-dark.svg"
          class="aiscoo-share-motion aiscoo-share-dark"
          alt=""
          aria-hidden="true"
        />
        <img
          src="../ui/src/xwork/brand/assets/mark-light.svg"
          class="aiscoo-share-still aiscoo-share-light"
          alt=""
          aria-hidden="true"
        />
        <img
          src="../ui/src/xwork/brand/assets/mark-dark.svg"
          class="aiscoo-share-still aiscoo-share-dark"
          alt=""
          aria-hidden="true"
        />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
