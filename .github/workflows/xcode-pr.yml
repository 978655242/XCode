# XWork PR 必过检查。job 名 policy / verify 被 release 规则集设为 required status checks，改名需同步更新规则集。
name: XWork PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: xcode-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Test branch policy
        run: node --test scripts/xcode/branch-policy.test.mjs
      - name: Check branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/xcode/branch-policy.mjs pr

  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0" # 与 mise.toml 保持一致
          cache: pnpm
      # 只跑静态检查，不需要 node-pty 等原生模块的 postinstall 构建。
      # pnpm 10.33.2 在 Linux 大 workspace 上存在 `_tmp_*` 目录 rename 竞态
      # （pnpm#13627 / #12880：patchedDependencies 的 process.chdir 与 worker 线程
      # hardLinkDir 冲突），单核执行可稳定规避；本地 macOS 安装不受影响。
      - run: taskset -c 0 pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm architecture:check
      # XWork 原生单测（node --test）；部分用例导入 zcode-cli 工作区包的 dist，需先构建。
      # zcode-cli 自己不装 turbo；与 build:sea 相同，用根依赖的 turbo 在其目录下构建。
      - run: pnpm exec turbo --skip-infer --cwd apps/zcode-cli run build
      - run: pnpm test:unit:node
      # 只检查本 PR 改动；同步 PR 的改动来自上游，跳过。基线就未格式化的上游存量文件也跳过，
      # 避免为追加几行而整份重排上游文件（违反最小改动并制造同步冲突）。
      - name: Test format check
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'sync/') }}
        env:
          OXFMT_BIN: ${{ github.workspace }}/node_modules/.bin/oxfmt
        run: node --test scripts/xcode/format-changed.test.mjs
      - name: Format check (changed files)
        if: ${{ !startsWith(github.event.pull_request.head.ref, 'sync/') }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          OXFMT_BIN: ${{ github.workspace }}/node_modules/.bin/oxfmt
        run: node scripts/xcode/format-changed.mjs "origin/${BASE_REF}"
