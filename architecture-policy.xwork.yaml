# XWork 下游模块登记。scripts/architecture/policy.mjs 的 loadPolicy 把这里的 modules
# 追加到 architecture-policy.yaml 之后再统一校验（重复 id、未知依赖照常报错）。
# 上游 architecture-policy.yaml 保持与 ZCode 一致，XWork 模块只登记在本文件，避免同步冲突。
# pnpm architecture:adopt 对上游 YAML 中没有的模块会登记或更新到本文件。
# 新旧 ID 共用同一模块 owner、依赖和公开边界；旧清单无需重排。
aliases:
  cli-aiscoo: cli-xwork
  cli-aiscoo-brand: cli-brand
  aiscoo-startup-context: xwork-startup-context
  aiscoo-plugin-guides-protocol: xwork-plugin-guides-protocol
  aiscoo-plugin-guides-cli: xwork-plugin-guides-cli
  aiscoo-plugin-guides-service: xwork-plugin-guides-service
  aiscoo-plugin-guides-ui: xwork-plugin-guides-ui
  aiscoo-brand: xwork-brand
  aiscoo-brand-ui: xwork-brand-ui
modules:
  - id: cli-zen-auth
    roots:
      - apps/zcode-cli/packages/adapters/src/auth/zen
    managed: true
    requires: [shared, zcode-cli, xwork-brand]
    publicEntrypoints:
      - apps/zcode-cli/packages/adapters/src/auth/zen/index.ts
      - apps/zcode-cli/packages/adapters/src/auth/zen/contract.ts
    layers:
      adapters: .
    owner: cli
  - id: cli-zen-account
    roots:
      - apps/zcode-cli/packages/bootstrap/src/zen
    managed: true
    requires: [shared, cli-zen-auth, provider, zcode-cli, xwork-brand]
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/zen/index.ts
      - apps/zcode-cli/packages/bootstrap/src/zen/contract.ts
    layers:
      app: .
    owner: cli
  - id: cli-xwork
    roots:
      - apps/zcode-cli/packages/cli/src/xwork
      - apps/zcode-cli/packages/cli/src/aiscoo
    managed: true
    requires: [cli-arguments, cli-sea-keyring, zcode-cli, cli-brand]
    publicEntrypoints:
      - apps/zcode-cli/packages/cli/src/xwork/index.ts
      - apps/zcode-cli/packages/cli/src/xwork/contract.ts
      - apps/zcode-cli/packages/cli/src/aiscoo/index.ts
      - apps/zcode-cli/packages/cli/src/aiscoo/contract.ts
    layers:
      app: .
    owner: cli
  - id: cli-sea-keyring
    roots:
      - apps/zcode-cli/packages/cli/src/sea-keyring
    managed: true
    requires: []
    publicEntrypoints:
      - apps/zcode-cli/packages/cli/src/sea-keyring/index.ts
      - apps/zcode-cli/packages/cli/src/sea-keyring/contract.ts
    layers:
      adapters: .
    owner: cli
  # xwork-startup-context：由 architecture:adopt 登记
  - id: xwork-startup-context
    roots:
      - packages/ui/src/xwork/startup-context
      - packages/ui/src/aiscoo/startup-context
    managed: true
    requires:
      - ui
    publicEntrypoints:
      - packages/ui/src/xwork/startup-context/index.ts
      - packages/ui/src/xwork/startup-context/contract.ts
      - packages/ui/src/aiscoo/startup-context/index.ts
      - packages/ui/src/aiscoo/startup-context/contract.ts
    layers:
      ui: .
    owner: conversation
  - id: xwork-plugin-guides-protocol
    roots: [packages/shared/src/xwork-plugin-guides, packages/shared/src/aiscoo-plugin-guides]
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/shared/src/xwork-plugin-guides/index.ts
      - packages/shared/src/xwork-plugin-guides/contract.ts
      - packages/shared/src/aiscoo-plugin-guides/index.ts
      - packages/shared/src/aiscoo-plugin-guides/contract.ts
    layers: { domain: . }
    owner: plugin
  - id: xwork-plugin-guides-cli
    roots:
      - apps/zcode-cli/packages/adapters/src/xwork-plugin-guides
      - apps/zcode-cli/packages/bootstrap/src/xwork-plugin-guides
      - apps/zcode-cli/packages/core/src/xwork-plugin-guides
      - apps/zcode-cli/packages/adapters/src/aiscoo-plugin-guides
      - apps/zcode-cli/packages/bootstrap/src/aiscoo-plugin-guides
      - apps/zcode-cli/packages/core/src/aiscoo-plugin-guides
    managed: true
    requires: [zcode-cli, shared, xwork-plugin-guides-protocol]
    publicEntrypoints:
      - apps/zcode-cli/packages/adapters/src/xwork-plugin-guides/index.ts
      - apps/zcode-cli/packages/adapters/src/xwork-plugin-guides/contract.ts
      - apps/zcode-cli/packages/bootstrap/src/xwork-plugin-guides/index.ts
      - apps/zcode-cli/packages/bootstrap/src/xwork-plugin-guides/contract.ts
      - apps/zcode-cli/packages/core/src/xwork-plugin-guides/index.ts
      - apps/zcode-cli/packages/core/src/xwork-plugin-guides/contract.ts
      - apps/zcode-cli/packages/adapters/src/aiscoo-plugin-guides/index.ts
      - apps/zcode-cli/packages/adapters/src/aiscoo-plugin-guides/contract.ts
      - apps/zcode-cli/packages/bootstrap/src/aiscoo-plugin-guides/index.ts
      - apps/zcode-cli/packages/bootstrap/src/aiscoo-plugin-guides/contract.ts
      - apps/zcode-cli/packages/core/src/aiscoo-plugin-guides/index.ts
      - apps/zcode-cli/packages/core/src/aiscoo-plugin-guides/contract.ts
    layers: { app: . }
    owner: plugin
  - id: xwork-plugin-guides-service
    roots: [packages/services/src/xwork-plugin-guides, packages/services/src/aiscoo-plugin-guides]
    managed: true
    requires: [services, shared, rpc, provider, xwork-plugin-guides-protocol, xwork-brand]
    publicEntrypoints:
      - packages/services/src/xwork-plugin-guides/index.ts
      - packages/services/src/xwork-plugin-guides/contract.ts
      - packages/services/src/xwork-plugin-guides/node.ts
      - packages/services/src/aiscoo-plugin-guides/index.ts
      - packages/services/src/aiscoo-plugin-guides/contract.ts
      - packages/services/src/aiscoo-plugin-guides/node.ts
    layers:
      contract: contract.ts
      domain: domain
      app: app
      adapters: adapters
    layerOrder: [contract, domain, app, adapters]
    owner: plugin
  - id: xwork-plugin-guides-ui
    roots: [packages/ui/src/xwork/plugin-guides, packages/ui/src/aiscoo/plugin-guides]
    managed: true
    requires: [ui, services, shared, xwork-plugin-guides-protocol, xwork-plugin-guides-service]
    publicEntrypoints:
      - packages/ui/src/xwork/plugin-guides/index.ts
      - packages/ui/src/xwork/plugin-guides/contract.ts
      - packages/ui/src/aiscoo/plugin-guides/index.ts
      - packages/ui/src/aiscoo/plugin-guides/contract.ts
    layers: { contract: contract.ts, ui: . }
    owner: plugin
  # xwork-brand：由 architecture:adopt 登记
  - id: xwork-brand
    roots:
      - packages/shared/src/xwork-brand
      - packages/shared/src/aiscoo-brand
    managed: true
    requires: []
    publicEntrypoints:
      - packages/shared/src/xwork-brand/index.ts
      - packages/shared/src/xwork-brand/contract.ts
      - packages/shared/src/xwork-brand/runtime.js
      - packages/shared/src/xwork-brand/runtime.d.ts
      - packages/shared/src/aiscoo-brand/index.ts
      - packages/shared/src/aiscoo-brand/contract.ts
      - packages/shared/src/aiscoo-brand/runtime.js
      - packages/shared/src/aiscoo-brand/runtime.d.ts
    layers:
      domain: .
    owner: product
  - id: cli-brand
    roots: [apps/zcode-cli/packages/i18n/src/xwork-brand, apps/zcode-cli/packages/i18n/src/aiscoo-brand]
    managed: true
    requires: [zcode-cli, xwork-brand]
    publicEntrypoints:
      - apps/zcode-cli/packages/i18n/src/xwork-brand/index.ts
      - apps/zcode-cli/packages/i18n/src/xwork-brand/contract.ts
      - apps/zcode-cli/packages/i18n/src/aiscoo-brand/index.ts
      - apps/zcode-cli/packages/i18n/src/aiscoo-brand/contract.ts
    layers: { domain: . }
    owner: product
  - id: xwork-brand-ui
    roots: [packages/ui/src/xwork/brand, packages/ui/src/aiscoo/brand]
    managed: true
    requires: [ui, shared, xwork-brand]
    publicEntrypoints:
      - packages/ui/src/xwork/brand/index.ts
      - packages/ui/src/xwork/brand/contract.ts
      - packages/ui/src/aiscoo/brand/index.ts
      - packages/ui/src/aiscoo/brand/contract.ts
    layers: { ui: . }
    owner: product
  # XCODE: 法律入口使用独立下游模块与既有品牌事实来源。
  - id: aiscoo-legal-ui
    roots: [packages/ui/src/aiscoo/legal]
    managed: true
    requires: [ui, shared, xwork-brand]
    publicEntrypoints:
      - packages/ui/src/aiscoo/legal/index.ts
      - packages/ui/src/aiscoo/legal/contract.ts
    layers: { ui: . }
    owner: product
  # 头像 fallback 插槽与产品派生值分别保持独立所有权。
  - id: profile-avatar
    roots: [packages/ui/src/profile-avatar]
    managed: true
    requires: [shared]
    publicEntrypoints:
      - packages/ui/src/profile-avatar/index.ts
      - packages/ui/src/profile-avatar/contract.ts
    layers: { ui: . }
    owner: account
  - id: xwork-account-avatar
    roots: [packages/ui/src/xwork/account-avatar]
    managed: true
    requires: [profile-avatar, shared]
    publicEntrypoints:
      - packages/ui/src/xwork/account-avatar/index.ts
      - packages/ui/src/xwork/account-avatar/contract.ts
    layers: { ui: . }
    owner: account
