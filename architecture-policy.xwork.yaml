# XWork 下游模块登记。scripts/architecture/policy.mjs 的 loadPolicy 把这里的 modules
# 追加到 architecture-policy.yaml 之后再统一校验（重复 id、未知依赖照常报错）。
# 上游 architecture-policy.yaml 保持与 ZCode 一致，XWork 模块只登记在本文件，避免同步冲突。
# pnpm architecture:adopt 对上游 YAML 中没有的模块会登记或更新到本文件。
modules:
  - id: cli-zen-auth
    roots:
      - apps/zcode-cli/packages/adapters/src/auth/zen
    managed: true
    requires: [shared, zcode-cli]
    publicEntrypoints:
      - apps/zcode-cli/packages/adapters/src/auth/zen/index.ts
      - apps/zcode-cli/packages/adapters/src/auth/zen/contract.ts
    layers:
      adapters: .
    owner: cli
  - id: cli-zen-account
    roots:
      - apps/zcode-cli/packages/bootstrap/src/zen
    managed: true
    requires: [shared, cli-zen-auth, provider, zcode-cli]
    publicEntrypoints:
      - apps/zcode-cli/packages/bootstrap/src/zen/index.ts
      - apps/zcode-cli/packages/bootstrap/src/zen/contract.ts
    layers:
      app: .
    owner: cli
  - id: cli-xwork
    roots:
      - apps/zcode-cli/packages/cli/src/xwork
    managed: true
    requires: [cli-arguments, cli-sea-keyring, zcode-cli]
    publicEntrypoints:
      - apps/zcode-cli/packages/cli/src/xwork/index.ts
      - apps/zcode-cli/packages/cli/src/xwork/contract.ts
    layers:
      app: .
    owner: cli
  - id: cli-sea-keyring
    roots:
      - apps/zcode-cli/packages/cli/src/sea-keyring
    managed: true
    requires: []
    publicEntrypoints:
      - apps/zcode-cli/packages/cli/src/sea-keyring/index.ts
      - apps/zcode-cli/packages/cli/src/sea-keyring/contract.ts
    layers:
      adapters: .
    owner: cli
